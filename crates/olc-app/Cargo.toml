[package]
name = "olc-app"
description = "OLC Core: the desktop app that runs a node and a miner, holds a wallet, finds every OLC it can reach and manages boards."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "olc-core"
path = "src/main.rs"

[lib]
name = "olc_app"
path = "src/lib.rs"

[features]
# Bluetooth, on Linux with BlueZ and the D-Bus library.
ble = ["olc-service/ble"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "clipboard", "accesskit"] }
egui = { version = "0.37", default-features = false }
olc-control.workspace = true
olc-core.workspace = true
olc-crypto.workspace = true
olc-lab.workspace = true
olc-lang.workspace = true
olc-logo.workspace = true
olc-node.workspace = true
olc-service.workspace = true
olc-wallet.workspace = true
serde_json.workspace = true

[dev-dependencies]
olc-pow.workspace = true
olc-store.workspace = true
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
png = "0.18"
