<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OfflineCoin</title>
<style>
:root {
  --ink: #16181a; --muted: #62676d; --line: #dcdedf;
  --ground-top: #f7f7f5; --ground-bottom: #e7e8e6;
  --tile-top: #ffffff; --tile-bottom: #f1f1ef;
  --good: #1f7a4d; --bad: #b3372b; --shadow: 0 1px 2px rgb(0 0 0 / .08), 0 6px 18px rgb(0 0 0 / .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eceded; --muted: #989da3; --line: #303336;
    --ground-top: #26282a; --ground-bottom: #16171a;
    --tile-top: #2e3033; --tile-bottom: #232528;
    --good: #5fc592; --bad: #ec7f73; --shadow: 0 1px 2px rgb(0 0 0 / .5), 0 8px 22px rgb(0 0 0 / .35);
  }
}
* { box-sizing: border-box; }
html { background: var(--ground-bottom); }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  background: linear-gradient(180deg, var(--ground-top), var(--ground-bottom)) fixed;
  font: 14px/1.45 ui-rounded, "Avenir Next", "Segoe UI Variable", "Noto Sans KR", sans-serif;
}
main { max-width: 1040px; margin: 0 auto; padding: 20px 20px 48px; }
header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
#coin { margin: 0; font: 700 7px/7px ui-monospace, "DejaVu Sans Mono", monospace; color: var(--ink); }
h1 { font-size: 19px; margin: 0; font-weight: 650; }
h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 500; }
.spacer { flex: 1; }
.facts { color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 14px; }
.facts b { color: var(--ink); font-weight: 600; }
a { color: inherit; }
button, input, select {
  font: inherit; color: inherit; border: 1px solid var(--line); border-radius: 7px;
  background: var(--tile-top); min-height: 34px; padding: 0 12px;
}
input, select { width: 100%; min-width: 0; }
button:disabled { opacity: .55; cursor: default; }
button { cursor: pointer; }
button:active { transform: translateY(1px); }
button.primary { background: var(--ink); color: var(--tile-top); border-color: var(--ink); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.chain { display: flex; gap: 22px; overflow-x: auto; padding: 8px 6px 18px; margin: 0 -6px 18px; scroll-behavior: smooth; }
.block {
  position: relative; flex: 0 0 118px; padding: 10px 12px; border-radius: 9px;
  background: linear-gradient(180deg, var(--tile-top), var(--tile-bottom));
  box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / .08);
}
.block + .block::before {
  content: ""; position: absolute; left: -22px; top: 50%; width: 22px; height: 2px; background: var(--line);
}
.block b { font-size: 16px; font-weight: 650; display: block; }
.block span { color: var(--muted); font-size: 13px; display: block; font-family: ui-monospace, monospace; }
.block.mine { outline: 1.5px solid var(--good); }
.block.fresh { animation: arrive .45s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes arrive { from { transform: translateX(26px) scale(.94); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .block.fresh { animation: none; } }
.columns { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
section { min-width: 0; }
.balance { font-size: 26px; font-weight: 650; margin: 0; }
.address { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin: 4px 0 14px; cursor: copy; }
form { display: grid; gap: 8px; grid-template-columns: 1fr 110px auto; }
form input[name=to] { grid-column: 1 / -1; }
#result { min-height: 20px; margin: 8px 0 0; font-size: 13px; }
.bad { color: var(--bad); }
.good { color: var(--good); }
ul { list-style: none; margin: 0; padding: 0; }
li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; }
li time { color: var(--muted); font-size: 13px; flex: none; }
#boards { margin-bottom: 22px; }
.board {
  margin-bottom: 10px; padding: 11px 14px; border-radius: 9px;
  background: linear-gradient(180deg, var(--tile-top), var(--tile-bottom));
  box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / .08);
}
.board.silent .facts, .board.silent .where { opacity: .6; }
.board > button.head {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; width: 100%; padding: 0;
  border: 0; background: none; text-align: left; min-height: 34px;
}
.board .title { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
.board .title::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%;
  background: var(--good); vertical-align: 1px;
}
.board.silent .title::before { background: var(--bad); }
.board .where { color: var(--muted); flex: 1; min-width: 120px; }
.board .facts { flex-basis: 100%; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 26px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.control { display: grid; gap: 4px; min-width: 0; align-content: start; }
.control > span { color: var(--muted); font-size: 13px; }
.line { display: flex; gap: 8px; min-width: 0; align-items: center; }
.line > button { flex: none; }
.line.cap { flex-wrap: wrap; }
.line.cap input { flex: 1 1 88px; width: 88px; }
.line.cap button.chosen { font-weight: 600; border-color: currentColor; }
#computer-cap { margin: 10px 0; max-width: 420px; }
form.line { grid-template-columns: none; }
.wide { grid-column: 1 / -1; }
.pay { display: grid; gap: 8px; grid-template-columns: 1fr 110px auto; }
.note { min-height: 20px; margin: 0; font-size: 13px; }
.new-board { display: grid; gap: 4px; margin-bottom: 10px; }
.new-board .port { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
#extras { margin-top: 30px; }
#extras summary { color: var(--muted); cursor: pointer; font-size: 13px; min-height: 24px; }
#extras .panel { margin-top: 10px; display: grid; gap: 8px; }
#extras p { margin: 0; color: var(--muted); max-width: 62ch; }
#extras pre {
  margin: 0; padding: 10px 12px; max-height: 340px; overflow: auto; border-radius: 7px;
  border: 1px solid var(--line); font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
}
@media (max-width: 680px) {
  main { padding: 16px 16px 40px; }
  .columns, .controls { grid-template-columns: 1fr; }
  button, input, select { min-height: 44px; font-size: 16px; }
  .board > button.head { min-height: 44px; }
  .pay { grid-template-columns: 1fr 1fr; }
  .pay input:first-child, .pay button { grid-column: 1 / -1; }
  form { grid-template-columns: 1fr 1fr; }
  form button { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<main>
  <header>
    <pre id="coin" aria-hidden="true"></pre>
    <h1 id="name">OfflineCoin</h1>
    <span class="facts" id="facts"></span>
    <span class="spacer"></span>
    <span id="siblings"></span>
    <button id="mining"></button>
    <button id="language">한국어</button>
  </header>
  <div id="computer-cap"></div>
  <section id="boards" hidden>
    <h2 data-text="boards"></h2>
    <div id="new-boards"></div>
    <div id="board-list"></div>
  </section>
  <div class="chain" id="chain"></div>
  <div class="columns">
    <section>
      <h2 data-text="wallet"></h2>
      <p class="balance" id="balance"></p>
      <p class="address" id="address"></p>
      <form id="send">
        <input name="to" required autocomplete="off" spellcheck="false" data-hint="to">
        <input name="amount" required inputmode="decimal" data-hint="amount">
        <input name="fee" inputmode="decimal" data-hint="fee">
        <button class="primary" data-text="send"></button>
      </form>
      <p id="result"></p>
    </section>
    <section>
      <h2 data-text="activity"></h2>
      <ul id="events"></ul>
    </section>
  </div>
  <section id="extras" hidden>
    <details>
      <summary data-text="experiments"></summary>
      <div id="extra-panels"></div>
    </details>
  </section>
</main>
<script>
const words = {
  en: {
    wallet: "Wallet", activity: "Activity", send: "Send", to: "Address", amount: "Amount", fee: "Fee",
    start: "Start mining", stop: "Stop mining", peers: "peers", pending: "waiting", hashes: "H/s", block: "block",
    you: "You", mined: "You mined block {h}", accepted: "Received block {h}",
    reorg: "Switched branch at block {h}, replacing {d}", block_rejected: "Rejected a block: {d}",
    tx: "Payment accepted", tx_rejected: "Rejected a payment: {d}", sent: "Sent",
    NotEnoughCoins: "Not enough spendable coins", bad_request: "Check the address and amount",
    ZeroAmount: "Enter an amount", node: "Node",
    money_in: "You received {d} OLC", money_out: "You sent {d} OLC",
    tx_returned: "A payment is waiting again", tx_dropped: "A payment was dropped: {d}",
    boards: "Boards", usb: "USB", radio: "Radio", radio_through: "Radio through {b}", network: "Network",
    silent: "Not responding", cap: "Hash cap", relaxed: "Relaxed", half: "Half", full: "Full", balance: "Balance", set: "Set",
    state_offline: "Offline", go_offline: "Go offline", go_online: "Go online", go_mine: "Start mining", go_idle: "Stop mining",
    pay: "Pay", screen: "Screen", view_basic: "Basic", view_detail: "Detail", view_easy: "Easy",
    screen_language: "Screen language", board_name: "Name", save: "Save", firmware: "Firmware", update: "Update",
    refused_count: "Refused {n}", preparing: "Preparing", restarting: "Restarting", installing: "Installing",
    new_board: "New board", install: "Install", update_failed: "Update failed", install_failed: "Install failed",
    no_answer: "The board did not answer", busy: "Wait for the update to finish", refused_order: "The board refused", not_done: "The board could not do that",
    experiments: "Experiments", language_en: "English", language_ko: "한국어",
  },
  ko: {
    wallet: "지갑", activity: "기록", send: "보내기", to: "주소", amount: "금액", fee: "수수료",
    start: "채굴 시작", stop: "채굴 중지", peers: "연결", pending: "대기", hashes: "H/s", block: "블록",
    you: "나", mined: "{h}번 블록을 채굴했습니다", accepted: "{h}번 블록을 받았습니다",
    reorg: "{h}번 블록에서 체인을 바꿨습니다. {d}개 교체", block_rejected: "블록을 거부했습니다: {d}",
    tx: "송금을 받아들였습니다", tx_rejected: "송금을 거부했습니다: {d}", sent: "보냈습니다",
    NotEnoughCoins: "쓸 수 있는 코인이 부족합니다", bad_request: "주소와 금액을 확인해 주세요",
    ZeroAmount: "금액을 입력해 주세요", node: "노드",
    money_in: "{d} OLC를 받았습니다", money_out: "{d} OLC를 보냈습니다",
    tx_returned: "송금이 다시 대기 중입니다", tx_dropped: "송금이 버려졌습니다: {d}",
    boards: "보드", usb: "USB", radio: "무선", radio_through: "{b} 통해 무선", network: "네트워크",
    silent: "응답 없음", cap: "해시 상한", relaxed: "여유", half: "절반", full: "최대", balance: "잔액", set: "적용",
    state_offline: "오프라인", go_offline: "오프라인으로", go_online: "온라인으로", go_mine: "채굴 시작", go_idle: "채굴 중지",
    pay: "송금", screen: "화면", view_basic: "기본", view_detail: "자세히", view_easy: "쉽게",
    screen_language: "화면 언어", board_name: "이름", save: "저장", firmware: "펌웨어", update: "업데이트",
    refused_count: "거부 {n}회", preparing: "준비 중", restarting: "다시 시작하는 중", installing: "설치 중",
    new_board: "새 보드", install: "설치", update_failed: "업데이트 실패", install_failed: "설치 실패",
    no_answer: "보드가 응답하지 않습니다", busy: "업데이트가 끝나면 시작하세요", refused_order: "보드가 거부했습니다", not_done: "보드가 처리하지 못했습니다",
    experiments: "실험", language_en: "English", language_ko: "한국어",
  },
};
const stored = (() => { try { return localStorage.getItem("language"); } catch { return null; } })();
let language = stored === "ko" ? "ko" : "en";
let last = null;
let newest = -1;
const $ = (id) => document.getElementById(id);
const say = (key) => words[language][key] ?? key;

function applyWords() {
  document.documentElement.lang = language;
  $("language").textContent = language === "en" ? "한국어" : "English";
  document.querySelectorAll("[data-text]").forEach((node) => { node.textContent = say(node.dataset.text); });
  document.querySelectorAll("[data-hint]").forEach((node) => { node.placeholder = say(node.dataset.hint); });
  if (last) draw(last);
  document.dispatchEvent(new Event("words"));
}

function draw(state) {
  last = state;
  document.title = `${state.ticker} ${state.height}`;
  $("name").textContent = state.name;
  $("facts").replaceChildren(...[
    [say("block"), state.height], [say("peers"), state.peers], [say("pending"), state.pool],
    [say("hashes"), state.hashrate.toLocaleString()],
  ].map(([label, value]) => {
    const fact = document.createElement("span");
    const number = document.createElement("b");
    number.textContent = value;
    fact.append(`${label} `, number);
    return fact;
  }));
  $("balance").textContent = `${state.balance.toLocaleString(undefined, { maximumFractionDigits: 8 })} ${state.ticker}`;
  $("address").textContent = state.address;
  $("mining").textContent = say(state.mining ? "stop" : "start");
  if (typeof showComputerCap === "function") showComputerCap(state);

  const chain = $("chain");
  chain.replaceChildren(...state.blocks.map((block) => {
    const tile = document.createElement("div");
    const mine = block.miner === state.self;
    tile.className = "block" + (mine ? " mine" : "") + (block.height > newest && newest >= 0 ? " fresh" : "");
    const title = document.createElement("b");
    title.textContent = block.height;
    const id = document.createElement("span");
    id.textContent = block.id.slice(0, 8);
    const who = document.createElement("span");
    who.textContent = mine ? say("you") : block.miner.slice(0, 8);
    tile.append(title, id, who);
    return tile;
  }));
  if (state.height > newest) chain.scrollLeft = chain.scrollWidth;
  newest = state.height;

  $("events").replaceChildren(...state.events.slice(-14).reverse().map((event) => {
    const row = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = say(event.kind).replace("{h}", event.height).replace("{d}", event.detail);
    if (event.kind.endsWith("rejected") || event.kind === "tx_dropped") text.className = "bad";
    const time = document.createElement("time");
    time.textContent = new Date(event.time).toLocaleTimeString();
    row.append(text, time);
    return row;
  }));

  const here = Number(location.port);
  $("siblings").replaceChildren(...state.siblings.map((port, index) => {
    const link = document.createElement(port === here ? "b" : "a");
    if (port !== here) link.href = `http://${location.hostname}:${port}/`;
    link.textContent = `${say("node")} ${index + 1}`;
    link.style.marginRight = "10px";
    return link;
  }));
}

async function refresh() {
  try { draw(await (await fetch("/api/status")).json()); } catch {}
}
const post = (path, body) => fetch(path, { method: "POST", body: JSON.stringify(body) }).then((reply) => reply.json());

$("language").onclick = () => {
  language = language === "en" ? "ko" : "en";
  try { localStorage.setItem("language", language); } catch {}
  applyWords();
};
$("mining").onclick = async () => { await post("/api/mining", { on: !last?.mining }); refresh(); };
$("address").onclick = () => navigator.clipboard?.writeText($("address").textContent);
$("send").onsubmit = async (event) => {
  event.preventDefault();
  const form = event.target;
  const reply = await post("/api/send", {
    to: form.to.value.trim(), amount: Number(form.amount.value), fee: Number(form.fee.value || 0),
  });
  const result = $("result");
  result.textContent = reply.error ? say(reply.error) : say("sent");
  result.className = reply.error ? "bad" : "good";
  if (!reply.error) form.reset();
  refresh();
};
async function spinCoin() {
  const frames = await (await fetch("/api/logo")).json();
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let frame = 1;
  $("coin").textContent = frames[frame];
  if (!still) setInterval(() => { frame = (frame + 1) % frames.length; $("coin").textContent = frames[frame]; }, 70);
}
applyWords();
refresh();
spinCoin();
setInterval(refresh, 1000);
</script>
<script src="/boards.js"></script>
</body>
</html>
