[package]
name = "olc-platform"
description = "What differs between operating systems, behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Bluetooth on Linux, through BlueZ and the D-Bus library, which a build needs to have.
ble = ["dep:olc-link-ble", "olc-link-ble/bluez"]

[target.'cfg(target_os = "linux")'.dependencies]
olc-link-ble = { path = "../olc-link-ble", optional = true }
olc-link-espnow = { path = "../olc-link-espnow", features = ["card"] }

[dependencies]
olc-node.workspace = true
socket2 = { version = "0.6", features = ["all"] }
serial2 = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
serial2 = { version = "0.2", features = ["unix"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
win32job = "2"
winreg = "0.56"
