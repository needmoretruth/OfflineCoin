[package]
name = "olc-service"
description = "Everything OLC Core does, with no screen: node, miner, wallet, boards, discovery, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Bluetooth on Linux, through BlueZ and the D-Bus library, which a build needs to have.
ble = ["olc-platform/ble"]

[dependencies]
getrandom = "0.3"
olc-board.workspace = true
olc-channel.workspace = true
olc-control.workspace = true
olc-core.workspace = true
olc-crypto.workspace = true
olc-lab.workspace = true
olc-lang.workspace = true
olc-link-tcp.workspace = true
olc-node.workspace = true
olc-pool.workspace = true
olc-platform.workspace = true
olc-pow.workspace = true
olc-store.workspace = true
olc-wallet = { workspace = true, features = ["seed"] }
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
# How much memory is free, so the Lab stops adding nodes before the computer struggles.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
zeroize = "1.8"
if-addrs = "0.15"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
olc-link-serial.workspace = true
