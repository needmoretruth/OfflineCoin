# The Flatpak, made by flatpak.sh from the folder that is also the Linux tar.gz. Nothing is compiled
# here: the programs are the ones every Linux package carries.
id: io.github.needmoretruth.OfflineCoin
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: olc-core
rename-desktop-file: olc-core.desktop
rename-icon: olc-core
finish-args:
  # The window, on Wayland or X11.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # Boards on USB serial ports, and the graphics card. No narrower permission reaches a serial port.
  - --device=all
  # Peers on the local network, found and listened for.
  - --share=network
  # Bluetooth through BlueZ.
  - --system-talk-name=org.bluez
  # The wallet and chain, shared with the terminal program.
  - --filesystem=~/.olc:create
  # The places the app offers for saving and opening files, and USB drives.
  - --filesystem=xdg-desktop
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=/run/media
  - --filesystem=/media
modules:
  - name: olc-core
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    sources:
      - type: dir
        path: folder
        dest: folder
      - type: file
        path: io.github.needmoretruth.OfflineCoin.metainfo.xml
      - type: file
        path: LICENSE
    # The flashing tool sits beside the app, where the app looks first.
    build-commands:
      - install -Dm755 -t /app/bin folder/bin/olc-core folder/bin/espflash
      - mkdir -p /app/share
      - cp -R folder/share/applications folder/share/icons /app/share/
      - install -Dm644 -t /app/share/metainfo io.github.needmoretruth.OfflineCoin.metainfo.xml
      - install -Dm644 -t /app/share/licenses/io.github.needmoretruth.OfflineCoin LICENSE
