name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"
  ESP_TOOLCHAIN: "1.97.0.0"
  ESPUP_VERSION: "0.19.0"
  ESPFLASH_VERSION: "4.7.0"
  CARGO_TERM_COLOR: always
  FIRMWARE: firmware/target/xtensa-esp32s3-none-elf/release

jobs:
  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Espressif toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          cargo install espup --locked --version "$ESPUP_VERSION"
          espup install --targets esp32s3 --toolchain-version "$ESP_TOOLCHAIN" --export-file "$HOME/export-esp.sh"
      - name: Build the firmware
        working-directory: firmware
        run: |
          . "$HOME/export-esp.sh"
          cargo build --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: ${{ env.FIRMWARE }}/olc-firmware
          if-no-files-found: error

  build:
    name: Build for ${{ matrix.target }}
    needs: firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install what the build needs on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: ${{ env.FIRMWARE }}
      - name: Build the app, carrying the firmware
        run: cargo build --release --locked -p olc-app --bin olc-core --target "${{ matrix.target }}"
      - name: Build the terminal program, carrying the firmware
        run: cargo build --release --locked -p olc-cli --bin olc --target "${{ matrix.target }}"
      - name: Build the flashing tool
        run: cargo install espflash --locked --version "$ESPFLASH_VERSION" --target "${{ matrix.target }}"
      - name: Package
        run: packaging/package.sh "${{ matrix.target }}" "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "OLC Core ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md
