name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tests and clippy on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install what the window and Bluetooth need on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev mesa-vulkan-drivers pkg-config
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_VERSION }}-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy with Bluetooth
        if: runner.os == 'Linux'
        run: cargo clippy -p olc-app -p olc-cli --all-targets --locked --features olc-app/ble,olc-cli/ble -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
